# ============================================================
# Alembic Configuration — UMOA Banking Intelligence
# ============================================================

[alembic]
# Path to the migrations directory
script_location = migrations

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Maximum character length for migration slug
truncate_slug_length = 40

# Timezone for generated timestamps
timezone = UTC

# Encoding for migration files
output_encoding = utf-8

# NOTE: database URL is NOT set here.
# It is loaded from environment variables in migrations/env.py.
# Never hardcode the database URL here.

[post_write_hooks]
# No post-write hooks for now

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
